<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pipe Workshop ERP 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a control-room console — 3D workshop floor on the left, ERP context panel on the right,
   station rail beneath, then tabbed registers (Master Plan / Spool Register / QMS documents). */
:root{
  --bg:#EDF0F3; --panel:#FFFFFF; --panel-2:#F5F7F9; --ink:#17202A; --muted:#5A6674; --line:#D6DDE4;
  --accent:#2F6FD6; --accent-ink:#FFFFFF; --scene:#E2E7EC; --floor:#C7CFD7; --grid:#AEB8C2;
  --ok:#23915F; --warn:#C07A0A; --bad:#CF3B3B; --ok-bg:#E2F3EA; --warn-bg:#FBF0DC; --bad-bg:#FBE4E4;
  --font-display:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif;
  --font-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1318; --panel:#151C23; --panel-2:#1A222B; --ink:#E3E8ED; --muted:#8D99A6; --line:#26313C;
    --accent:#6C9EFF; --accent-ink:#0B1220; --scene:#0F151B; --floor:#1A222B; --grid:#2A3540;
    --ok:#3CC487; --warn:#E5A23A; --bad:#F06464; --ok-bg:#12291F; --warn-bg:#2C2210; --bad-bg:#2E1616;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1318; --panel:#151C23; --panel-2:#1A222B; --ink:#E3E8ED; --muted:#8D99A6; --line:#26313C;
  --accent:#6C9EFF; --accent-ink:#0B1220; --scene:#0F151B; --floor:#1A222B; --grid:#2A3540;
  --ok:#3CC487; --warn:#E5A23A; --bad:#F06464; --ok-bg:#12291F; --warn-bg:#2C2210; --bad-bg:#2E1616;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 32px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:.01em}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-bottom:12px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 320px}
.brand h1{font-size:22px;font-weight:700}
.brand .sub{color:var(--muted);font-size:13px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 12px;cursor:pointer;line-height:1.3}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:6px 10px;cursor:pointer;font-family:var(--font-mono);font-size:12px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.clock{font-family:var(--font-mono);font-size:13px;padding:6px 10px;border:1px dashed var(--line);border-radius:6px;color:var(--muted)}
.clock b{color:var(--ink);font-weight:600}

/* main console */
.console{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px;align-items:stretch}
.stage{position:relative;background:var(--scene);border:1px solid var(--line);border-radius:8px;overflow:hidden;min-height:520px}
#scene{position:absolute;inset:0;display:block;width:100%;height:100%;cursor:grab}
.stage .hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--panel) 80%,transparent);padding:4px 8px;border-radius:4px;pointer-events:none}
.stage .legend{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px;font-size:12px;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);padding:8px 10px;border-radius:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.stage .sim-tag{position:absolute;left:12px;top:10px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--warn-bg);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);padding:3px 8px;border-radius:4px}

.side{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:14px;min-width:0;max-height:620px;overflow:auto}
.side h2{font-size:18px}
.side .eyebrow{font-family:var(--font-mono);font-size:12px;color:var(--accent)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--font-mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .k{font-size:12px;color:var(--muted)}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:flex;justify-content:space-between;gap:10px;font-size:13px;border-bottom:1px dotted var(--line);padding-bottom:4px}
.row span:first-child{color:var(--muted)}
.row span:last-child{text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--font-mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:2px 6px;background:var(--panel-2)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;letter-spacing:.03em}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.bar{display:block;height:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent)}
.list{display:flex;flex-direction:column;gap:4px}
.list button{display:flex;justify-content:space-between;gap:8px;text-align:left;border:1px solid var(--line);background:var(--panel-2);border-radius:5px;padding:5px 8px;cursor:pointer;font-size:12px}
.list button:hover{border-color:var(--accent)}
.route{display:flex;flex-direction:column;gap:0}
.route .st{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;font-size:12.5px;padding:3px 0}
.route .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);margin-left:3px}
.route .done .dot{background:var(--ok);border-color:var(--ok)}
.route .now .dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
.route .skip{color:var(--muted);text-decoration:line-through}
.route .sub{padding-left:22px;font-size:12px}
.route .sub .dot{width:10px;height:10px}
.back{align-self:flex-start;border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-size:13px}

/* station rail */
.rail{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:6px;margin-top:12px}
.stc.assy{background:color-mix(in srgb,#8A6BD1 9%,var(--panel));border-style:dashed}
.stc.assy .n{color:#8A6BD1}
.stc{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 8px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0;border-top:3px solid var(--ok)}
.stc.warn{border-top-color:var(--warn)} .stc.bad{border-top-color:var(--bad)}
.stc[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:-1px}
.stc .n{font-family:var(--font-mono);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stc .t{font-size:12px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stc .q{font-family:var(--font-mono);font-size:11px;color:var(--muted);display:flex;justify-content:space-between}

/* tabs */
.tabs{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.tablist{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:6px 6px 0;flex-wrap:wrap}
.tablist button{border:0;background:none;padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;font-weight:500;color:var(--muted)}
.tablist button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabpanel{padding:14px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap}
td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
tr.phase td{font-weight:600;background:var(--panel-2)}
.gantt{position:relative;height:16px;min-width:360px}
.gantt .pl{position:absolute;top:3px;height:10px;background:color-mix(in srgb,var(--accent) 28%,transparent);border-radius:2px}
.gantt .ac{position:absolute;top:3px;height:10px;background:var(--accent);border-radius:2px}
.gantt .ms{position:absolute;top:1px;width:12px;height:12px;background:var(--warn);transform:translateX(-6px) rotate(45deg);border-radius:1px}
.gantt .sd{position:absolute;top:-6px;bottom:-6px;width:0;border-left:2px solid var(--bad)}
.planhead{display:flex;flex-wrap:wrap;gap:8px 24px;margin-bottom:10px;font-size:13px}
.planhead b{font-family:var(--font-mono)}
.note{font-size:12px;color:var(--muted);margin-top:10px}
tr.clk{cursor:pointer} tr.clk:hover td{background:var(--panel-2)}

@media (max-width: 1100px){
  .console{grid-template-columns:1fr}
  .side{max-height:none}
  .rail{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}
}
@media (max-width: 560px){
  .stage{min-height:380px}
  .rail{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .stage .legend{display:none}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <h1>Pipe Workshop ERP 3D</h1>
    <div class="sub">SPK Distribution · Stainless Steel Pipe Fabrication (SS304L / SS316L) · สายหลัก 10 สถานี + สาย Assembly Spool (A1–A3) เข้า Final Inspection</div>
  </div>
  <div class="controls">
    <button class="btn primary" id="playBtn" type="button">❚❚ หยุดชั่วคราว</button>
    <div class="seg" role="group" aria-label="ความเร็วจำลอง" id="speedSeg">
      <button type="button" data-s="1" aria-pressed="false">1×</button>
      <button type="button" data-s="2" aria-pressed="true">2×</button>
      <button type="button" data-s="4" aria-pressed="false">4×</button>
      <button type="button" data-s="8" aria-pressed="false">8×</button>
    </div>
    <button class="btn" id="addBtn" type="button">+ ปล่อย Spool ใหม่</button>
    <button class="btn" id="viewBtn" type="button">มุมมองภาพรวม</button>
    <span class="clock" id="clock">วันที่ <b>1</b> · <b>08:00</b></span>
  </div>
</header>

<section class="console">
  <div class="stage" id="stage">
    <canvas id="scene" aria-label="ภาพ 3 มิติของโรงงานประกอบท่อ"></canvas>
    <span class="sim-tag">ข้อมูลจำลอง · Simulation</span>
    <div class="legend" id="legend"></div>
    <span class="hint">ลากเพื่อหมุน · ล้อเมาส์เพื่อซูม · คลิกสถานีหรือ Spool เพื่อดูรายละเอียด</span>
  </div>
  <aside class="side" id="side" aria-live="polite"></aside>
</section>

<nav class="rail" id="rail" aria-label="สถานีงาน"></nav>

<section class="tabs">
  <div class="tablist" role="tablist">
    <button role="tab" id="tab-plan" aria-selected="true" aria-controls="p-plan" type="button">แผนงานหลัก (Master Plan)</button>
    <button role="tab" id="tab-spool" aria-selected="false" aria-controls="p-spool" type="button">ทะเบียน Spool (Traveller)</button>
    <button role="tab" id="tab-docs" aria-selected="false" aria-controls="p-docs" type="button">เอกสาร QMS ต่อกระบวนการ</button>
  </div>
  <div class="tabpanel" id="p-plan" role="tabpanel" aria-labelledby="tab-plan"></div>
  <div class="tabpanel" id="p-spool" role="tabpanel" aria-labelledby="tab-spool" hidden></div>
  <div class="tabpanel" id="p-docs" role="tabpanel" aria-labelledby="tab-docs" hidden></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const tok = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Process master data (QP-PIPE-01, re-sequenced for the workshop floor) ----------
   Main line : 01 → 02 → 03 → 04 Groove (grooved spools only) → 05 Welding → 06 → 07 → 08 Flushing→Passivation → 09 Final Inspection → 10
   Assembly  : after 08, assembly spools branch to A1 → A2 → A3 and rejoin at 09 Final Inspection */
const ST = [
  {no:'01', th:'ตรวจรับและจัดเก็บวัตถุดิบ', short:'รับ/จัดเก็บวัตถุดิบ', en:'Material Acceptance & Storage', wi:'WI-PIPE-01', qc:'WI-QC-PIPE-01', qr:['01-1','01-2','01-3','01-4','01-5'], cap:3, t:1.5, kind:'store', row:'N', x:-16, crew:[['op','Storekeeper'],['qc','QC Inspector']], ctrl:'Hold — ตรวจ MTC / Heat No. ก่อนปล่อยเข้าผลิต'},
  {no:'02', th:'การตัดท่อ', short:'ตัดท่อ', en:'Cutting', wi:'WI-PIPE-02', qc:'WI-QC-PIPE-02', qr:['02-1','02-2','02-3','02-4'], cap:2, t:1.2, kind:'saw', row:'N', x:-8, crew:[['op','Cutter'],['op','Fitter']], ctrl:'ตรวจความยาว/มุมตัด ตาม Cutting List'},
  {no:'03', th:'การเตรียมประกอบท่อ (Pre-fabrication)', short:'Pre-fab / Fit-up', en:'Pre-fabrication (End prep, Fit-up, Tack)', wi:'WI-PIPE-03', qc:'WI-QC-PIPE-03', qr:['03-1','03-2','03-3','03-4'], cap:3, t:2.4, kind:'table', row:'N', x:0, crew:[['op','Fitter'],['op','Fitter'],['op','Fitter']], ctrl:'Fit-up inspection — ระยะ Gap / Alignment'},
  {no:'04', th:'การต่อท่อแบบร่องรัด (Groove)', short:'ขึ้นร่อง Groove', en:'Groove (Roll / Cut Groove)', wi:'WI-PIPE-05', qc:'WI-QC-PIPE-05', qr:['05-1'], cap:2, t:1.3, kind:'groove', row:'N', x:8, crew:[['op','Operator']], ctrl:'ตรวจขนาดร่องตามสเปคผู้ผลิต Coupling · ต่อด้วย Welding'},
  {no:'05', th:'การเชื่อม (Welding)', short:'เชื่อม GTAW', en:'Welding (GTAW + purge)', wi:'WI-PIPE-04', qc:'WI-QC-PIPE-04', qr:['04-1','04-2','04-3','03-3','03-4'], cap:4, t:3.6, kind:'weld', row:'N', x:16, crew:[['weld','Welder'],['weld','Welder'],['weld','Welder'],['weld','Welder']], ctrl:'VT/PT 100% ตาม WPS ที่รับรอง'},
  {no:'06', th:'การตรวจสอบขนาด', short:'ตรวจสอบขนาด', en:'Dimensional Verification', wi:'WI-PIPE-06', qc:'WI-QC-PIPE-06', qr:['06-1','06-2'], cap:2, t:1.0, kind:'cmm', row:'S', x:16, crew:[['qc','QC Inspector']], ctrl:'Hold Point — เทียบแบบ Isometric / GA'},
  {no:'07', th:'การทดสอบแรงดัน', short:'ทดสอบแรงดัน', en:'Pressure Test (Hydro / Pneumatic)', wi:'WI-PIPE-07', qc:'WI-QC-PIPE-07', qr:['07-1'], cap:3, t:2.6, kind:'press', row:'S', x:8, crew:[['op','Test Technician'],['qc','QC Manager']], ctrl:'Witness Point — แจ้งลูกค้าล่วงหน้า'},
  {no:'08', th:'การล้างท่อ และ Passivation', short:'Flushing → Passivation', en:'Flushing & Cleaning → Passivation (continuous)', wi:'WI-PIPE-08 / 09', qc:'WI-QC-PIPE-08 / 09', qr:['08-1','08-2','09-1','09-2','09-3'], cap:4, t:4.2, split:0.42, subs:['Flushing','Passivation'], kind:'fp', row:'S', x:0, crew:[['op','Flushing Tech'],['op','Passivation Tech']], ctrl:'คุณภาพน้ำ → Ferroxyl test (ไม่มี Free Iron)'},
  {no:'09', th:'การตรวจสอบขั้นสุดท้าย (Final Inspection)', short:'Final Inspection', en:'Final Inspection & Release', wi:'WI-PIPE-10', qc:'WI-QC-PIPE-10', qr:['10-3','10-4'], cap:2, t:1.1, kind:'final', row:'S', x:-8, crew:[['qc','QC Inspector'],['qc','Client / TPI']], ctrl:'Hold Point — ปล่อยงานก่อนบรรจุ (FM-PIPE-10-3)'},
  {no:'10', th:'การบรรจุหีบห่อ', short:'บรรจุหีบห่อ', en:'Packaging', wi:'WI-PIPE-10', qc:'WI-QC-PIPE-10', qr:['10-1','10-2'], cap:2, t:1.2, kind:'pack', row:'S', x:-16, crew:[['op','Packing Lead'],['op','Packer']], ctrl:'Packing list / crate tag ครบ'},
  {no:'A1', th:'รวมชุดอุปกรณ์ Assembly (Kitting)', short:'A1 รวมชุด Kitting', en:'Assembly Kitting — spools, valves, fittings, gaskets', wi:'WI-PIPE-11 (เสนอ)', qc:'—', qr:['ASM-1 Kitting list'], cap:2, t:1.2, kind:'kit', row:'A', x:8, assy:true, crew:[['op','Storekeeper']], ctrl:'ตรวจชุดอุปกรณ์ครบตาม Assembly drawing'},
  {no:'A2', th:'ประกอบ Assembly Spool', short:'A2 ประกอบ Assembly', en:'Assembly — flange bolt-up, coupling, valve', wi:'WI-PIPE-11 (เสนอ)', qc:'—', qr:['ASM-2 Assembly record'], cap:3, t:3.0, kind:'assy', row:'A', x:0, assy:true, crew:[['op','Fitter'],['op','Fitter'],['op','Rigger']], ctrl:'ลำดับขันน็อต / ทิศทางวาล์ว ตามแบบ'},
  {no:'A3', th:'ตรวจ Torque และขนาด Assembly', short:'A3 ตรวจ Torque', en:'Torque & Assembly Dimension Check', wi:'WI-PIPE-11 (เสนอ)', qc:'—', qr:['ASM-3 Torque record'], cap:2, t:1.0, kind:'torque', row:'A', x:-8, assy:true, crew:[['qc','QC Inspector']], ctrl:'ค่า Torque ตามสเปค · ขนาดรวมตาม GA'},
];
const ORDER = [0,1,2,3,4,5,6,7,10,11,12,8,9];      // display order (assembly branch sits between 08 and 09)
const ROW = { N:{zc:-6.4, face:1, flow:1}, S:{zc:6.4, face:-1, flow:-1}, A:{zc:15.4, face:-1, flow:-1} };
const R = i => ROW[ST[i].row];
const slotZ = i => R(i).zc + R(i).face * 2.9;
const laneZr = r => ROW[r].zc + ROW[r].face * 5.1;
const CORRIDORS = [-20,-12,-4,4,12,20];

const JOBS = [
  {code:'PJ-2026-001', name:'Chilled Water Piping — Data Center Phase 1', client:'ABC Data Center Co., Ltd. (ตัวอย่างจาก FM-PIPE-00)', color:'#2F6FD6', pre:'CHW'},
  {code:'SPK.CS061.26', name:'COOLIT-TCL Piping Installation', client:'DAMAC BKK03-DC01', color:'#14A39A', pre:'TCS'},
];
const SIZES = ['2"','3"','4"','6"','8"'];

/* ---------- Simulation state ---------- */
const sim = { t: 0, speed: 2, running: true, spawnIn: 0, seq: 0, shipped: 0, ncr: 0, cycles: [] };
const spools = [];
const stRun = ST.map(() => ({queue: [], work: [], done: 0, util: 0}));
const rnd = mulberry(20261020);
function mulberry(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function routeFor(s){ return [0,1,2, ...(s.groove ? [3] : []), 4,5,6,7, ...(s.assy ? [10,11,12] : []), 8,9]; }
function newSpool(){
  const job = JOBS[rnd() < 0.62 ? 0 : 1];
  sim.seq++;
  const s = {
    id: `${job.pre}-${String(1000 + sim.seq)}`, job, groove: rnd() < 0.35, assy: rnd() < 0.4,
    size: SIZES[Math.floor(rnd()*SIZES.length)], mat: rnd() < 0.55 ? 'SS316L' : 'SS304L',
    heat: 'H' + Math.floor(20000 + rnd()*70000), joints: 2 + Math.floor(rnd()*5),
    step: 0, phase: 'move', remain: 0, dur: 0, slot: -1, path: null, prog: 0,
    born: sim.t, log: {}, ncr: 0, ncrOpen: false, shippedAt: null, mesh: null, toDock: false, yaw: 0
  };
  s.route = routeFor(s);
  spools.push(s);
  return s;
}

/* ---------- Floor geometry & paths ---------- */
const DOCK = new THREE.Vector3(-24, 1.0, 4.2);
const RECV = new THREE.Vector3(-24, 1.0, -3.4);
function fpZone(s){ return s.dur && (s.dur - s.remain) / s.dur >= ST[7].split ? 1 : 0; }
function workPos(i, k, s){
  const st = ST[i], fl = R(i).flow;
  if (st.kind === 'fp' && s){
    const zone = fpZone(s);
    const mates = stRun[i].work.filter(w => fpZone(w) === zone);
    const j = Math.max(0, mates.indexOf(s)), n = Math.max(1, mates.length);
    return new THREE.Vector3(st.x + fl * (zone ? 1.15 : -1.15) + (j - (n-1)/2) * 0.62, 1.02, slotZ(i));
  }
  return new THREE.Vector3(st.x + (k - (st.cap-1)/2) * 0.95, 1.02, slotZ(i));
}
function queuePos(i, q){
  const x = ST[i].x - R(i).flow * (2.75 + (q % 3) * 0.42);
  return new THREE.Vector3(x, 0.22 + Math.floor(q/3) * 0.4, slotZ(i));
}
// waypoints between two aisle points; crossing into/out of the assembly lane uses the nearest gap between stations
function lanePts(ax, ar, bx, br, y){
  const la = laneZr(ar), lb = laneZr(br), pts = [new THREE.Vector3(ax, y, la)];
  if (la !== lb){
    const crossesRow = ar === 'A' || br === 'A';
    const cx = crossesRow ? CORRIDORS.reduce((m, c) => Math.abs(c - (ax+bx)/2) < Math.abs(m - (ax+bx)/2) ? c : m) : bx;
    pts.push(new THREE.Vector3(cx, y, la), new THREE.Vector3(cx, y, lb));
  }
  pts.push(new THREE.Vector3(bx, y, lb));
  return pts;
}
function mkPath(pts){ let len = 0; for (let k=1;k<pts.length;k++) len += pts[k].distanceTo(pts[k-1]); return {pts, len}; }
function buildPath(from, fromRow, ti, toDock){
  const target = toDock ? DOCK.clone() : queuePos(ti, stRun[ti].queue.length + 1);
  const tr = toDock ? 'S' : ST[ti].row;
  return mkPath([from.clone(), ...lanePts(from.x, fromRow, target.x, tr, 1.0), target]);
}
function pointOnPath(path, d){
  for (let k=1;k<path.pts.length;k++){
    const seg = path.pts[k].distanceTo(path.pts[k-1]);
    if (d <= seg || k === path.pts.length-1) return path.pts[k-1].clone().lerp(path.pts[k], seg ? Math.min(1, Math.max(0,d)/seg) : 1);
    d -= seg;
  }
  return path.pts[path.pts.length-1].clone();
}
function startMove(s, fromPos, fromRow, ti, toDock){
  s.phase = 'move'; s.toDock = !!toDock; s.target = ti;
  s.path = buildPath(fromPos, fromRow, ti, toDock); s.prog = 0;
}

/* ---------- Sim tick (sim hours) ---------- */
const MOVE_SPEED = 7; // m per sim-hour — a person carrying a spool
const REWORK = {5: 4, 6: 4, 8: 7, 12: 11};   // failed at → sent back to
const FAIL_P = {5: 0.04, 6: 0.05, 8: 0.03, 12: 0.04};
function tick(dt){
  sim.t += dt;
  sim.spawnIn -= dt;
  const active = spools.filter(s => !s.shippedAt).length;
  if (sim.spawnIn <= 0 && active < 52){ spawnAtReceiving(); sim.spawnIn = 1.1 + rnd()*0.7; }

  ST.forEach((st, i) => {
    const r = stRun[i];
    for (const s of [...r.work]){
      s.remain -= dt;
      if (st.kind === 'fp' && s.log[i] && s.log[i].flushEnd === undefined && fpZone(s)) s.log[i].flushEnd = sim.t;
      if (s.remain <= 0) finishAt(i, s);
    }
    while (r.work.length < st.cap && r.queue.length){
      const s = r.queue.shift();
      const used = new Set(r.work.map(w => w.slot));
      let k = 0; while (used.has(k)) k++;
      s.slot = k; s.phase = 'work';
      s.dur = s.remain = st.t * (0.7 + rnd()*0.6) * (s.joints/8 + 0.5);
      s.log[i] = s.log[i] || {}; s.log[i].start = sim.t; delete s.log[i].flushEnd;
      r.work.push(s);
    }
    const a = 1 - Math.exp(-dt/6);
    r.util += ((r.work.length / st.cap) - r.util) * a;
  });

  for (const s of spools){
    if (s.phase !== 'move') continue;
    s.prog += MOVE_SPEED * dt;
    if (s.prog >= s.path.len){
      if (s.toDock){ s.phase = 'shipped'; s.shippedAt = sim.t; sim.shipped++; sim.cycles.push(sim.t - s.born); if (sim.cycles.length > 40) sim.cycles.shift(); }
      else { s.phase = 'queue'; s.log[s.target] = s.log[s.target] || {}; s.log[s.target].in = sim.t; stRun[s.target].queue.push(s); }
    }
  }
  for (let k = spools.length-1; k >= 0; k--){
    const s = spools[k];
    if (s.shippedAt && sim.t - s.shippedAt > 30){ if (s.mesh) scene.remove(s.mesh); spools.splice(k,1); }
  }
}
function finishAt(i, s){
  const r = stRun[i];
  r.work.splice(r.work.indexOf(s), 1);
  r.done++;
  s.log[i].end = sim.t;
  const from = workPos(i, s.slot, null);
  if (FAIL_P[i] && rnd() < FAIL_P[i]){
    s.ncr++; sim.ncr++; s.ncrOpen = true;
    s.lastNcr = {at: ST[i].no, back: ST[REWORK[i]].no, t: sim.t};
    s.step = s.route.indexOf(REWORK[i]);
    startMove(s, from, ST[i].row, REWORK[i]);
    return;
  }
  if (i === 8) s.ncrOpen = false;
  s.step++;
  if (s.step >= s.route.length) startMove(s, from, ST[i].row, null, true);
  else startMove(s, from, ST[i].row, s.route[s.step]);
}
function spawnAtReceiving(){ const s = newSpool(); startMove(s, RECV.clone(), 'N', 0); return s; }
function seed(){
  const plan = [[0,3],[1,2],[2,3],[3,2],[4,6],[5,2],[6,4],[7,4],[10,2],[11,3],[12,1],[8,2],[9,2]];
  for (const [i, n] of plan){
    for (let k=0;k<n;k++){
      const s = newSpool();
      if (i === 3) s.groove = true;
      if (ST[i].assy) s.assy = true;
      s.route = routeFor(s);
      s.step = s.route.indexOf(i);
      s.born = -(4 + s.step * 3 + rnd()*3);
      for (let p=0;p<s.step;p++) s.log[s.route[p]] = {in: s.born + p*2.5, start: s.born + p*2.5 + .4, end: s.born + p*2.5 + 2};
      s.phase = 'queue'; s.log[i] = {in: -1};
      stRun[i].queue.push(s);
    }
  }
  sim.shipped = 18; sim.ncr = 2;
  sim.cycles = [31,28,34,30,27,36,29,33];
  for (let k=0;k<20;k++) tick(0.15);
}

function box(w,h,d,mat,x,y,z,parent){ const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat); m.position.set(x,y,z); m.castShadow = m.receiveShadow = true; parent.add(m); return m; }
function cyl(r,h,mat,x,y,z,parent,rot){ const m = new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,24), mat); m.position.set(x,y,z); if (rot) m.rotation.set(rot[0],rot[1],rot[2]); m.castShadow = m.receiveShadow = true; parent.add(m); return m; }

// machines are built in station-local space: local -z = back wall, local +z = toward the aisle, local -x = upstream
function buildMachine(i, g){
  const k = ST[i].kind, fx = {};
  switch (k){
    case 'store': {
      for (const x of [-1.8, 0, 1.8]) box(0.15, 2.4, 1.6, M.blue, x, 1.2, -0.4, g);
      for (const y of [0.5, 1.2, 1.9]){ box(3.9, 0.08, 1.6, M.yellow, 0, y, -0.4, g);
        for (let p=0;p<5;p++) cyl(0.12, 3.6, M.steel, 0, y+0.16, -1.0 + p*0.3, g, [0,0,Math.PI/2]); }
      box(1.0, 0.9, 0.8, M.dark, 2.6, 0.45, -0.2, g);
      break; }
    case 'saw': {
      box(3.4, 0.9, 1.2, M.dark, 0, 0.45, -0.4, g);
      box(0.25, 1.6, 1.0, M.yellow, 0.4, 1.6, -0.4, g);
      fx.blade = box(0.9, 0.12, 0.05, M.steel, 0.4, 1.0, 0.05, g);
      break; }
    case 'table': {
      box(3.6, 0.1, 1.4, M.bench, 0, 0.95, -0.6, g);
      for (const x of [-1.6,1.6]) for (const z of [-1.2,0]) box(0.1, 0.9, 0.1, M.dark, x, 0.45, z, g);
      box(0.4, 0.4, 0.5, M.blue, -1.2, 1.2, -0.6, g); box(0.4, 0.4, 0.5, M.blue, 1.2, 1.2, -0.6, g);
      break; }
    case 'weld': {
      for (const x of [-2.4, 2.4]) box(0.05, 2.2, 2.6, M.curtain, x, 1.1, -0.2, g);
      box(4.8, 2.2, 0.05, M.curtain, 0, 1.1, -1.5, g);
      for (const x of [-1.6, -0.55, 0.55, 1.6]) box(0.6, 0.8, 0.5, M.blue, x, 0.4, -1.1, g);
      cyl(0.16, 1.3, M.dark, -2.0, 0.65, -1.0, g); cyl(0.16, 1.3, M.dark, 2.0, 0.65, -1.0, g);
      fx.light = new THREE.PointLight(0x9fc8ff, 0, 8); fx.light.position.set(0, 1.6, 2.2); g.add(fx.light);
      fx.spark = new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 12), new THREE.MeshBasicMaterial({color: 0xdfeeff}));
      fx.spark.position.set(0, 1.2, 2.5); g.add(fx.spark);
      break; }
    case 'groove': {
      box(1.6, 1.0, 1.2, M.red, -0.6, 0.5, -0.5, g);
      fx.roll = cyl(0.28, 0.3, M.steel, 0.4, 1.15, -0.1, g, [Math.PI/2,0,0]);
      box(1.2, 0.8, 1.0, M.dark, 1.4, 0.4, -0.5, g);
      break; }
    case 'cmm': {
      for (const x of [-1.8, 1.8]) box(0.15, 2.4, 0.15, M.yellow, x, 1.2, -0.3, g);
      fx.gantry = box(3.75, 0.2, 0.3, M.yellow, 0, 2.4, -0.3, g);
      box(3.4, 0.6, 1.2, M.dark, 0, 0.3, -0.6, g);
      break; }
    case 'press': {
      box(3.6, 0.5, 1.2, M.dark, 0, 0.25, -0.6, g);
      cyl(0.5, 1.6, M.blue, -2.2, 0.8, -0.9, g);
      fx.gauge = cyl(0.35, 0.08, M.steel, -2.2, 1.9, -0.4, g, [Math.PI/2,0,0]);
      fx.needle = box(0.04, 0.28, 0.02, M.red, -2.2, 1.9, -0.34, g);
      break; }
    case 'fp': {  // upstream: flushing tank · downstream: passivation bath
      cyl(0.75, 1.7, M.steel, -2.0, 0.85, -0.8, g);
      fx.water = cyl(0.7, 0.06, M.water, -2.0, 1.55, -0.8, g);
      box(0.9, 0.7, 0.7, M.blue, -0.8, 0.35, -1.0, g);
      box(2.4, 0.8, 1.3, M.bench, 1.4, 0.4, -0.8, g);
      fx.acid = box(2.2, 0.05, 1.1, M.acid, 1.4, 0.81, -0.8, g);
      box(0.06, 1.8, 1.6, M.white, 0.2, 0.9, -0.6, g); // splash wall between the two steps
      break; }
    case 'final': {
      box(3.6, 0.1, 1.2, M.white, 0, 0.95, -0.7, g);
      for (const x of [-1.6,1.6]) box(0.1, 0.9, 0.1, M.dark, x, 0.45, -0.7, g);
      box(0.08, 2.2, 0.08, M.dark, -1.9, 1.1, -1.2, g); box(1.4, 0.08, 0.08, M.dark, -1.25, 2.2, -1.2, g);
      fx.lamp = cyl(0.22, 0.12, M.yellow, -0.6, 2.1, -1.2, g);
      box(1.0, 1.2, 0.6, M.blue, 2.4, 0.6, -0.8, g);
      break; }
    case 'pack': {
      for (let a=0;a<3;a++) for (let b=0;b<2;b++) box(1.1, 0.7, 1.0, M.wood, -1.2 + a*1.2, 0.35 + b*0.72, -0.8, g);
      box(0.6, 1.6, 0.6, M.dark, 2.4, 0.8, -0.6, g);
      break; }
    case 'kit': {
      for (const x of [-1.5, 0, 1.5]) box(1.3, 1.6, 0.8, M.blue, x, 0.8, -1.0, g);
      for (const x of [-1.5, 0, 1.5]) { const w = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.05, 8, 20), M.red); w.position.set(x, 1.85, -1.0); g.add(w); }
      break; }
    case 'assy': {
      for (const x of [-2.2, 2.2]) box(0.15, 3.0, 0.15, M.purple, x, 1.5, -0.6, g);
      fx.hoist = box(4.55, 0.22, 0.22, M.purple, 0, 3.0, -0.6, g);
      fx.hook = box(0.2, 0.5, 0.2, M.yellow, 0, 2.6, -0.6, g);
      box(1.0, 0.8, 0.6, M.dark, -1.6, 0.4, -1.2, g);
      break; }
    case 'torque': {
      box(3.0, 0.9, 1.0, M.dark, 0, 0.45, -0.9, g);
      box(0.7, 0.5, 0.4, M.purple, 1.0, 1.15, -0.9, g);
      fx.gauge = cyl(0.25, 0.06, M.white, -0.8, 1.3, -0.7, g, [Math.PI/2,0,0]);
      break; }
  }
  return fx;
}

  x.fillStyle = tint || '#7FB0FF'; x.font = '600 32px "JetBrains Mono", monospace'; x.fillText(sub, 26, 50);
  x.fillStyle = '#FFFFFF'; x.font = '600 40px "IBM Plex Sans Thai", "Chakra Petch", sans-serif'; x.fillText(text, 26, 104);

}

function posePerson(p, mode, ph){
  const u = p.userData;
  if (mode === 'walk' || mode === 'carry'){
    const sw = Math.sin(ph) * 0.55;
    u.legL.rotation.x = sw; u.legR.rotation.x = -sw;
    if (mode === 'carry'){ u.armL.rotation.x = u.armR.rotation.x = -1.25; }
    else { u.armL.rotation.x = -sw * 0.7; u.armR.rotation.x = sw * 0.7; }
    p.position.y = Math.abs(Math.cos(ph)) * 0.04;
  } else if (mode === 'work'){
    u.legL.rotation.x = u.legR.rotation.x = 0;
    u.armL.rotation.x = -1.05 + Math.sin(ph * 2.2) * 0.18; u.armR.rotation.x = -1.05 + Math.cos(ph * 2.6) * 0.22;
    p.position.y = 0;
  } else {
    u.legL.rotation.x = u.legR.rotation.x = 0;
    u.armL.rotation.x = Math.sin(ph * 0.6) * 0.05; u.armR.rotation.x = -Math.sin(ph * 0.6) * 0.05;
    p.position.y = 0;
  }
}

const geo = {

const pipeMat = new THREE.MeshStandardMaterial({color: 0xd2d8de, metalness: 0.3, roughness: 0.32});
const jobMat = JOBS.map(j => new THREE.MeshStandardMaterial({color: new THREE.Color(j.color), roughness: .5}));
const ncrMat = new THREE.MeshBasicMaterial({color: 0xff4d4d});
const selMat = new THREE.MeshBasicMaterial({color: 0x6C9EFF});
function spoolMesh(s){
  const outer = new THREE.Group(), g = new THREE.Group();
  outer.add(g); g.rotation.x = Math.PI/2;
  const p = new THREE.Mesh(geo.pipe, pipeMat); p.castShadow = true; g.add(p);
  for (const y of [-1.0, 1.0]){ const f = new THREE.Mesh(geo.flange, pipeMat); f.position.y = y; f.castShadow = true; g.add(f); }
  if (s.groove) for (const y of [-0.8, 0.8]){ const gr = new THREE.Mesh(geo.groove, M.dark); gr.position.y = y; g.add(gr); }
  const b = new THREE.Mesh(geo.band, jobMat[JOBS.indexOf(s.job)]); b.position.y = 0.45; g.add(b);
  const valve = new THREE.Group(); valve.visible = false; g.add(valve);
  const vb = new THREE.Mesh(geo.valve, M.red); vb.position.set(0, -0.25, 0); valve.add(vb);
  const vw = new THREE.Mesh(geo.wheel, M.red); vw.position.set(0, -0.25, -0.38); valve.add(vw);
  const ring = new THREE.Mesh(geo.ring, ncrMat); ring.rotation.x = Math.PI/2; ring.visible = false; g.add(ring);
  const sel = new THREE.Mesh(geo.ring, selMat); sel.rotation.x = Math.PI/2; sel.position.y = -0.3; sel.visible = false; g.add(sel);
  outer.userData = {ring, sel, valve};
  outer.traverse(o => { o.userData.spool = s; });
  Object.assign(outer.userData, {ring, sel, valve});
  scene.add(outer);
  return outer;
}
function spoolTarget(s){
  if (s.phase === 'move') return pointOnPath(s.path, s.prog);
  const i = s.route[s.step];
  if (s.phase === 'work') return workPos(i, s.slot, s);
  if (s.phase === 'queue') return queuePos(i, stRun[i].queue.indexOf(s));
  const n = spools.filter(o => o.shippedAt && o.shippedAt <= s.shippedAt).length - 1;
  return new THREE.Vector3(-26.5 - 1.2 + (n % 6) * 0.45, 1.25 + Math.floor(n/6)%4 * 0.36, 6.2);
}

const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let down = null;
canvas.addEventListener('pointerdown', e => { down = {x: e.clientX, y: e.clientY}; canvas.style.cursor = 'grabbing'; });
canvas.addEventListener('pointerup', e => {
  canvas.style.cursor = 'grab';
  if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 5) return;
  const r = canvas.getBoundingClientRect();
  mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hs = ray.intersectObjects(spools.filter(s => s.mesh).map(s => s.mesh), true);
  if (hs.length){ select({spool: hs[0].object.userData.spool}); return; }

        if (ST[i].kind === 'fp' && lg && lg.start !== undefined && (cls === 'done' || (cls === 'now' && s.phase === 'work'))){
          const z = cls === 'done' ? 2 : fpZone(s);
          extra = `<div class="st sub ${z >= 1 ? 'done' : 'now'}"><span class="dot"></span><span>Flushing</span><span class="mono label" style="letter-spacing:0">${lg.flushEnd !== undefined ? tm(lg.flushEnd) : 'NOW'}</span></div>
                   <div class="st sub ${z >= 2 ? 'done' : z === 1 ? 'now' : ''}"><span class="dot"></span><span>Passivation</span><span class="mono label" style="letter-spacing:0">${z >= 2 && lg.end !== undefined ? tm(lg.end) : z === 1 ? 'NOW' : ''}</span></div>`;
        }
        return `<div class="st ${cls}"><span class="dot"></span><span>${name}</span><span class="mono label" style="letter-spacing:0">${right}</span></div>${extra}`;
      }).join('')}</div>`;
}
$('#side').addEventListener('click', e => {
  const b = e.target.closest('[data-back],[data-st],[data-sp]'); if (!b) return;
  if (b.hasAttribute('data-back')) { select({}); flyTo(HOME.pos.clone(), HOME.tgt.clone()); }
  else if (b.dataset.st) { select({station: +b.dataset.st}); flyStation(+b.dataset.st); }

});

function renderRail(){

    rail.innerHTML = ORDER.map(i => { const st = ST[i]; return `<button class="stc${st.assy ? ' assy' : ''}" type="button" data-i="${i}" aria-pressed="false"><span class="n" title="${esc(st.wi)}">${st.no}${st.assy ? ' · Assembly' : ''}</span><span class="t" title="${esc(st.th)}">${esc(st.short.replace(/^A\d /,''))}</span><span class="q"><span>ทำ <b data-w>0</b>/${st.cap}</span><span>คิว <b data-q>0</b></span></span><span class="bar"><i data-u style="width:0%"></i></span></button>`; }).join('');

}

/* ---------- Master Plan (FM-PIPE-00-1, example rows) ---------- */

  ['6','Phase','INSTALLATION & HANDOVER','S06','15-Feb-27','02-Apr-27',0,'On Track'],
  ['6.1','Task','Site mobilization, permits & safety induction','S06','15-Feb-27','19-Feb-27',0,'On Track'],
  ['6.2','Task','Installation / installation support','S06','22-Feb-27','26-Mar-27',0,'On Track'],
  ['6.3','Task','Site test & punch list closure','S06','22-Mar-27','02-Apr-27',0,'On Track'],
  ['6.4','Task','QC dossier & as-built drawing submission','S01','15-Mar-27','02-Apr-27',0,'On Track'],
  ['6.5','Milestone','Handover & project completion','S06','02-Apr-27','02-Apr-27',0,'On Track'],
];
const MON = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
const pd = s => { const [d,m,y] = s.split('-'); return Date.UTC(2000 + +y, MON[m], +d); };
const G0 = pd('02-Nov-26'), G1 = pd('26-Apr-27') + 7*864e5, SD = pd('14-Dec-26');
const gx = t => ((t - G0) / (G1 - G0) * 100).toFixed(2);
const FLAG = {'Done':'ok','On Track':'info','Behind':'warn','LATE':'bad'};
function renderPlan(){
  const months = []; for (let m = 0; m < 6; m++){ const t = Date.UTC(2026, 10 + m, 1); months.push(`<span style="position:absolute;left:${gx(Math.max(t,G0))}%;font-size:10px;color:var(--muted)">${new Date(t).toLocaleString('en',{month:'short', timeZone:'UTC'})}</span>`); }
  $('#p-plan').innerHTML = `
    <div class="planhead">
      <span>โครงการ <b>PJ-2026-001</b> Chilled Water Piping — Data Center Phase 1</span>
      <span>Status date <b>14-Dec-26</b></span><span>Plan <b>17.5%</b> · Actual <b>14.5%</b> · <span class="pill bad">LATE</span></span>
    </div>
    <div class="scroll"><table style="min-width:900px">
      <thead><tr><th>WBS</th><th>กิจกรรม</th><th>Section</th><th>เริ่ม</th><th>เสร็จ</th><th style="text-align:right">% เสร็จ</th><th>สถานะ</th><th style="width:38%"><div class="gantt" style="height:12px">${months.join('')}</div></th></tr></thead>
      <tbody>${PLAN.map(([w,ty,n,sec,ps,pf,pc,fl]) => {
        const a = pd(ps), b = pd(pf) + 864e5;
        const bar = ty === 'Milestone' ? `<span class="ms" style="left:${gx(a)}%"></span>` :
          `<span class="pl" style="left:${gx(a)}%;width:${(gx(b)-gx(a)).toFixed(2)}%"></span><span class="ac" style="left:${gx(a)}%;width:${((gx(b)-gx(a))*pc/100).toFixed(2)}%;${ty==='Phase'?'opacity:.6':''}"></span>`;
        return `<tr class="${ty === 'Phase' ? 'phase' : ''}"><td class="mono">${w}</td><td>${esc(n)}</td><td class="mono">${sec}</td><td class="num">${ps}</td><td class="num">${pf}</td><td class="num">${pc}%</td><td><span class="pill ${FLAG[fl]}">${fl}</span></td><td><div class="gantt">${bar}<span class="sd" style="left:${gx(SD)}%"></span></div></td></tr>`;
      }).join('')}</tbody></table></div>
    <p class="note">ข้อมูลตัวอย่างจากแบบฟอร์ม FM-PIPE-00-1 Master Project Plan (Rev.00) · แถบจาง = แผน, แถบเข้ม = ผลงานจริง, ◆ = Milestone / Hold Point, เส้นแดง = Status Date</p>`;
}

function renderSpools(){
  const list = [...spools].sort((a,b) => (!!a.shippedAt - !!b.shippedAt) || a.id.localeCompare(b.id));
  $('#p-spool').innerHTML = `<div class="scroll"><table style="min-width:860px">
    <thead><tr><th>Spool No.</th><th>โครงการ</th><th>ประเภท</th><th>ขนาด / วัสดุ</th><th>Heat No.</th><th>รอยต่อ</th><th>ตำแหน่งปัจจุบัน</th><th>NCR</th><th style="width:130px">ความคืบหน้า</th></tr></thead>
    <tbody>${list.map(s => `<tr class="clk" data-sp="${s.id}"><td class="mono">${s.id}</td><td><i style="display:inline-block;width:8px;height:8px;background:${s.job.color};border-radius:2px;margin-right:6px"></i>${esc(s.job.code)}</td><td>${s.assy ? 'Assembly' : 'Single'}</td><td class="mono">${s.size} ${s.mat}</td><td class="mono">${s.heat}</td><td>${s.groove ? 'Groove + Weld' : 'Weld'} ×${s.joints}</td><td>${esc(where(s))}</td><td class="num">${s.ncr ? `<span class="pill bad">${s.ncr}</span>` : '—'}</td><td><div class="bar"><i style="width:${(progressOf(s)*100).toFixed(0)}%"></i></div></td></tr>`).join('')}</tbody></table></div>
    <p class="note">คลิกแถวเพื่อเปิด Spool Traveller และไฮไลต์ในภาพ 3 มิติ · ข้อมูลจำลอง</p>`;
}
$('#p-spool').addEventListener('click', e => { const tr = e.target.closest('[data-sp]'); if (!tr) return; const s = spools.find(o => o.id === tr.dataset.sp); if (s && s.mesh){ select({spool: s}); const p = s.mesh.position; flyTo(new THREE.Vector3(p.x + 4, 8, p.z + 10), p.clone()); stage.scrollIntoView({behavior:'smooth', block:'center'}); } });

function renderDocs(){
  $('#p-docs').innerHTML = `<div class="scroll"><table style="min-width:780px">
    <thead><tr><th>No.</th><th>กระบวนการ</th><th>Procedure (QP)</th><th>ITP (QC)</th><th>Quality Records (QR)</th><th>จุดควบคุม</th></tr></thead>
    <tbody>${ORDER.map(i => { const st = ST[i]; return `<tr class="clk" data-st="${i}"><td class="mono">${st.no}</td><td><b>${st.assy ? '↳ ' : ''}${esc(st.th)}</b><br><span class="label" style="text-transform:none;letter-spacing:0">${esc(st.en)}</span></td><td class="mono">${esc(st.wi)}</td><td class="mono">${esc(st.qc)}</td><td><div class="chips">${st.qr.map(q => `<span class="chip">${st.assy ? esc(q) : 'WI-QR-PIPE-' + q}</span>`).join('')}</div></td><td>${esc(st.ctrl)}</td></tr>`; }).join('')}</tbody></table></div>
    <p class="note">อ้างอิง QP-PIPE-01 §5.2 จัดลำดับใหม่ตามผังโรงงาน: Groove ก่อน Welding · Flushing และ Passivation อยู่สถานีเดียวกันและทำต่อเนื่อง · Final Inspection ใช้แบบฟอร์ม WI-QR-PIPE-10-4 · สาย Assembly Spool (A1–A3) แยกหลัง 08 และเข้า 09 Final Inspection ยังไม่มี WI รองรับ เสนอให้จัดทำ WI-PIPE-11</p>`;
}
$('#p-docs').addEventListener('click', e => { const tr = e.target.closest('[data-st]'); if (!tr) return; const i = +tr.dataset.st; select({station: i}); flyStation(i); stage.scrollIntoView({behavior:'smooth', block:'center'}); });

document.querySelectorAll('[role=tab]').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('[role=tab]').forEach(o => { const on = o === t; o.setAttribute('aria-selected', on); $('#' + o.getAttribute('aria-controls')).hidden = !on; });
  if (t.id === 'tab-spool') renderSpools();
}));

$('#playBtn').addEventListener('click', () => { sim.running = !sim.running; $('#playBtn').textContent = sim.running ? '❚❚ หยุดชั่วคราว' : '▶ เดินเครื่อง'; });
$('#speedSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; sim.speed = +b.dataset.s; $('#speedSeg').querySelectorAll('button').forEach(o => o.setAttribute('aria-pressed', o === b)); });
$('#addBtn').addEventListener('click', () => { const s = spawnAtReceiving(); select({spool: s}); });
$('#viewBtn').addEventListener('click', () => { select({}); flyTo(HOME.pos.clone(), HOME.tgt.clone()); });

/* ---------- main loop ---------- */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let last = performance.now(), uiAcc = 0, tblAcc = 0, tAnim = 0;
const tmpA = new THREE.Vector3(), UP = new THREE.Vector3(0,1,0);
function frame(now){
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  const simDt = sim.running ? dt * sim.speed * 0.5 : 0;
  if (simDt){ const n = Math.ceil(simDt / 0.05); for (let k=0;k<n;k++) tick(simDt/n); }
  if (sim.running) tAnim += dt * Math.max(1, sim.speed / 2);

  for (const s of spools){
    if (!s.mesh) { s.mesh = spoolMesh(s); s.mesh.position.copy(spoolTarget(s)); }
    const tgt = spoolTarget(s);
    if (s.phase === 'move'){
      s.mesh.position.copy(tgt);
      const ahead = pointOnPath(s.path, s.prog + 0.4).sub(tgt);
      if (ahead.lengthSq() > 1e-4){
        const yaw = Math.atan2(ahead.x, ahead.z);
        s.mesh.rotation.y = yaw;
        if (!s.escort && !s.shippedAt) s.escort = takeEscort();
        const side = tmpA.set(ahead.z, 0, -ahead.x).normalize().multiplyScalar(0.45);
        s.escort.position.set(tgt.x + side.x, 0, tgt.z + side.z);
        s.escort.rotation.y = yaw;
        posePerson(s.escort, 'carry', s.prog * 5);
      }
    } else {
      freeEscort(s);
      s.mesh.position.lerp(tgt, 1 - Math.exp(-dt * 8));
      s.mesh.rotation.y += (0 - s.mesh.rotation.y) * Math.min(1, dt * 8);
    }
    s.mesh.userData.ring.visible = !!s.ncrOpen;
    s.mesh.userData.valve.visible = s.assy && s.step > s.route.indexOf(11);
  }
  for (const w of walkers){
    if (!sim.running){ posePerson(w.p, 'idle', tAnim); continue; }
    if (w.wait > 0){ w.wait -= dt; posePerson(w.p, 'work', tAnim + w.ph); if (w.wait <= 0) walkerNext(w); continue; }
    w.prog += dt * 1.5 * Math.max(0.6, sim.speed / 2);
    const pos = pointOnPath(w.path, w.prog), ahead = pointOnPath(w.path, w.prog + 0.3).sub(pos);
    w.p.position.set(pos.x, 0, pos.z);
    if (ahead.lengthSq() > 1e-4) w.p.rotation.y = Math.atan2(ahead.x, ahead.z);
    posePerson(w.p, 'walk', w.prog * 4.2);
    if (w.prog >= w.path.len){ w.wait = 1.6 + Math.random() * 1.6; const r = ROW[ST[w.stops[w.k]].row]; w.p.rotation.y = r.face > 0 ? Math.PI : 0; }
  }
  stations.forEach((o, i) => {
    const st = stationState(i), r = stRun[i];
    if (st !== o.state){ o.state = st; o.padMat.color.setHex(STATE_COL[st]); o.edge.material.color.setHex(STATE_COL[st]); }
    o.padMat.opacity = selection.station === i ? 0.42 : 0.2;
    o.crew.forEach((p, k) => {
      const active = sim.running && (ST[i].crew.length === ST[i].cap ? r.work.some(s => s.slot === k) : r.work.length > k * (ST[i].cap / ST[i].crew.length) - 0.01 && r.work.length > 0);
      posePerson(p, active && !reduce ? 'work' : 'idle', tAnim + i + k);
    });
    const busy = r.work.length > 0 && sim.running;
    const f = o.fx;
    if (f.light){ const on = busy && !reduce; f.light.intensity = on ? 1.2 + Math.random()*1.6 : 0; f.spark.visible = on && Math.random() > 0.25; }
    if (f.roll && busy && !reduce) f.roll.rotation.y += dt * 8;
    if (f.blade && busy && !reduce) f.blade.position.y = 1.0 + Math.sin(tAnim*6)*0.15;
    if (f.gantry && busy && !reduce) f.gantry.position.z = -0.3 + Math.sin(tAnim*1.4)*0.8;
    if (f.needle) f.needle.rotation.z = busy ? -0.4 - Math.sin(tAnim*0.8)*0.6 : 0.9;
    if (f.water && busy && !reduce) f.water.position.y = 1.55 + Math.sin(tAnim*3)*0.04;
    if (f.hook && busy && !reduce) f.hook.position.y = 2.3 + Math.sin(tAnim*0.9)*0.3;
  });
  if (flight){
    flight.k = Math.min(1, flight.k + dt * 1.4);
    const e = flight.k < .5 ? 2*flight.k*flight.k : 1 - Math.pow(-2*flight.k + 2, 2)/2;
    camera.position.lerpVectors(flight.p0, flight.p1, e); controls.target.lerpVectors(flight.t0, flight.t1, e);
    if (flight.k >= 1) flight = null;
  }
  controls.update();
  renderer.render(scene, camera);

  uiAcc += dt; tblAcc += dt;
  if (uiAcc > 0.4){
    uiAcc = 0; renderRail();
    const [d, hm] = clockTxt(sim.t); $('#clock').innerHTML = `วันที่ <b>${d}</b> · <b>${hm}</b>`;
    if (!hovering.has('#side') && !$('#side').contains(document.activeElement)) renderSide();
  }
  if (tblAcc > 1.5){ tblAcc = 0; if (!$('#p-spool').hidden && !hovering.has('#p-spool')) renderSpools(); }
  requestAnimationFrame(frame);
}

seed();
applyTheme();
resize();
renderRail(); renderSide(); renderPlan(); renderSpools(); renderDocs();
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => {
  stations.forEach((o, i) => { const pos = o.label.position.clone(); scene.remove(o.label); o.label = makeLabel(ST[i].short, labelSub(ST[i]), ST[i].assy ? '#C3AEFF' : null); o.label.position.copy(pos); scene.add(o.label); });
});
requestAnimationFrame(frame);
})();
</script>
