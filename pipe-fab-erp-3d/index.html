<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pipe Workshop ERP 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a control-room console — 3D workshop floor on the left, ERP context panel on the right,
   station rail beneath, then tabbed registers (Master Plan / Spool Register / QMS documents). */
:root{
  --bg:#EDF0F3; --panel:#FFFFFF; --panel-2:#F5F7F9; --ink:#17202A; --muted:#5A6674; --line:#D6DDE4;
  --accent:#2F6FD6; --accent-ink:#FFFFFF; --scene:#E2E7EC; --floor:#C7CFD7; --grid:#AEB8C2;
  --ok:#23915F; --warn:#C07A0A; --bad:#CF3B3B; --ok-bg:#E2F3EA; --warn-bg:#FBF0DC; --bad-bg:#FBE4E4;
  --font-display:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif;
  --font-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1318; --panel:#151C23; --panel-2:#1A222B; --ink:#E3E8ED; --muted:#8D99A6; --line:#26313C;
    --accent:#6C9EFF; --accent-ink:#0B1220; --scene:#0F151B; --floor:#1A222B; --grid:#2A3540;
    --ok:#3CC487; --warn:#E5A23A; --bad:#F06464; --ok-bg:#12291F; --warn-bg:#2C2210; --bad-bg:#2E1616;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1318; --panel:#151C23; --panel-2:#1A222B; --ink:#E3E8ED; --muted:#8D99A6; --line:#26313C;
  --accent:#6C9EFF; --accent-ink:#0B1220; --scene:#0F151B; --floor:#1A222B; --grid:#2A3540;
  --ok:#3CC487; --warn:#E5A23A; --bad:#F06464; --ok-bg:#12291F; --warn-bg:#2C2210; --bad-bg:#2E1616;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 32px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:.01em}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-bottom:12px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 320px}
.brand h1{font-size:22px;font-weight:700}
.brand .sub{color:var(--muted);font-size:13px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 12px;cursor:pointer;line-height:1.3}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:6px 10px;cursor:pointer;font-family:var(--font-mono);font-size:12px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.clock{font-family:var(--font-mono);font-size:13px;padding:6px 10px;border:1px dashed var(--line);border-radius:6px;color:var(--muted)}
.clock b{color:var(--ink);font-weight:600}

/* main console */
.console{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px;align-items:stretch}
.stage{position:relative;background:var(--scene);border:1px solid var(--line);border-radius:8px;overflow:hidden;min-height:520px}
#scene{position:absolute;inset:0;display:block;width:100%;height:100%;cursor:grab}
.stage .hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--panel) 80%,transparent);padding:4px 8px;border-radius:4px;pointer-events:none}
.stage .legend{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px;font-size:12px;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);padding:8px 10px;border-radius:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.stage .sim-tag{position:absolute;left:12px;top:10px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--warn-bg);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);padding:3px 8px;border-radius:4px}

.side{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:14px;min-width:0;max-height:620px;overflow:auto}
.side h2{font-size:18px}
.side .eyebrow{font-family:var(--font-mono);font-size:12px;color:var(--accent)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--font-mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .k{font-size:12px;color:var(--muted)}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:flex;justify-content:space-between;gap:10px;font-size:13px;border-bottom:1px dotted var(--line);padding-bottom:4px}
.row span:first-child{color:var(--muted)}
.row span:last-child{text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--font-mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:2px 6px;background:var(--panel-2)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;letter-spacing:.03em}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.bar{display:block;height:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent)}
.list{display:flex;flex-direction:column;gap:4px}
.list button{display:flex;justify-content:space-between;gap:8px;text-align:left;border:1px solid var(--line);background:var(--panel-2);border-radius:5px;padding:5px 8px;cursor:pointer;font-size:12px}
.list button:hover{border-color:var(--accent)}
.route{display:flex;flex-direction:column;gap:0}
.route .st{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;font-size:12.5px;padding:3px 0}
.route .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);margin-left:3px}
.route .done .dot{background:var(--ok);border-color:var(--ok)}
.route .now .dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
.route .skip{color:var(--muted);text-decoration:line-through}
.back{align-self:flex-start;border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-size:13px}

/* station rail */
.rail{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;margin-top:12px}
.stc{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 8px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0;border-top:3px solid var(--ok)}
.stc.warn{border-top-color:var(--warn)} .stc.bad{border-top-color:var(--bad)}
.stc[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:-1px}
.stc .n{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.stc .t{font-size:12px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stc .q{font-family:var(--font-mono);font-size:11px;color:var(--muted);display:flex;justify-content:space-between}

/* tabs */
.tabs{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.tablist{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:6px 6px 0;flex-wrap:wrap}
.tablist button{border:0;background:none;padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;font-weight:500;color:var(--muted)}
.tablist button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabpanel{padding:14px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap}
td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
tr.phase td{font-weight:600;background:var(--panel-2)}
.gantt{position:relative;height:16px;min-width:360px}
.gantt .pl{position:absolute;top:3px;height:10px;background:color-mix(in srgb,var(--accent) 28%,transparent);border-radius:2px}
.gantt .ac{position:absolute;top:3px;height:10px;background:var(--accent);border-radius:2px}
.gantt .ms{position:absolute;top:1px;width:12px;height:12px;background:var(--warn);transform:translateX(-6px) rotate(45deg);border-radius:1px}
.gantt .sd{position:absolute;top:-6px;bottom:-6px;width:0;border-left:2px solid var(--bad)}
.planhead{display:flex;flex-wrap:wrap;gap:8px 24px;margin-bottom:10px;font-size:13px}
.planhead b{font-family:var(--font-mono)}
.note{font-size:12px;color:var(--muted);margin-top:10px}
tr.clk{cursor:pointer} tr.clk:hover td{background:var(--panel-2)}

@media (max-width: 1100px){
  .console{grid-template-columns:1fr}
  .side{max-height:none}
  .rail{grid-template-columns:repeat(5,minmax(0,1fr))}
}
@media (max-width: 560px){
  .stage{min-height:380px}
  .rail{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:19px}
  .stage .legend{display:none}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <h1>Pipe Workshop ERP 3D</h1>
    <div class="sub">SPK Distribution · Stainless Steel Pipe Fabrication (SS304L / SS316L) · ผังกระบวนการตาม QP-PIPE-01 ทั้ง 10 กระบวนการ</div>
  </div>
  <div class="controls">
    <button class="btn primary" id="playBtn" type="button">❚❚ หยุดชั่วคราว</button>
    <div class="seg" role="group" aria-label="ความเร็วจำลอง" id="speedSeg">
      <button type="button" data-s="1" aria-pressed="false">1×</button>
      <button type="button" data-s="2" aria-pressed="true">2×</button>
      <button type="button" data-s="4" aria-pressed="false">4×</button>
      <button type="button" data-s="8" aria-pressed="false">8×</button>
    </div>
    <button class="btn" id="addBtn" type="button">+ ปล่อย Spool ใหม่</button>
    <button class="btn" id="viewBtn" type="button">มุมมองภาพรวม</button>
    <span class="clock" id="clock">วันที่ <b>1</b> · <b>08:00</b></span>
  </div>
</header>

<section class="console">
  <div class="stage" id="stage">
    <canvas id="scene" aria-label="ภาพ 3 มิติของโรงงานประกอบท่อ"></canvas>
    <span class="sim-tag">ข้อมูลจำลอง · Simulation</span>
    <div class="legend" id="legend"></div>
    <span class="hint">ลากเพื่อหมุน · ล้อเมาส์เพื่อซูม · คลิกสถานีหรือ Spool เพื่อดูรายละเอียด</span>
  </div>
  <aside class="side" id="side" aria-live="polite"></aside>
</section>

<nav class="rail" id="rail" aria-label="สถานีงาน"></nav>

<section class="tabs">
  <div class="tablist" role="tablist">
    <button role="tab" id="tab-plan" aria-selected="true" aria-controls="p-plan" type="button">แผนงานหลัก (Master Plan)</button>
    <button role="tab" id="tab-spool" aria-selected="false" aria-controls="p-spool" type="button">ทะเบียน Spool (Traveller)</button>
    <button role="tab" id="tab-docs" aria-selected="false" aria-controls="p-docs" type="button">เอกสาร QMS ต่อกระบวนการ</button>
  </div>
  <div class="tabpanel" id="p-plan" role="tabpanel" aria-labelledby="tab-plan"></div>
  <div class="tabpanel" id="p-spool" role="tabpanel" aria-labelledby="tab-spool" hidden></div>
  <div class="tabpanel" id="p-docs" role="tabpanel" aria-labelledby="tab-docs" hidden></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const tok = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Process master data (QP-PIPE-01 §5.1–5.2) ---------- */
const ST = [
  {no:'01', th:'ตรวจรับและจัดเก็บวัตถุดิบ', short:'รับ/จัดเก็บวัตถุดิบ', en:'Material Acceptance & Storage', wi:'WI-PIPE-01', qc:'WI-QC-PIPE-01', qr:['01-1','01-2','01-3','01-4','01-5'], cap:3, t:1.5, kind:'store', ctrl:'Hold — ตรวจ MTC / Heat No. ก่อนปล่อยเข้าผลิต', pic:'Storekeeper + QC Inspector'},
  {no:'02', th:'การตัดท่อ', short:'ตัดท่อ', en:'Cutting', wi:'WI-PIPE-02', qc:'WI-QC-PIPE-02', qr:['02-1','02-2','02-3','02-4'], cap:2, t:1.2, kind:'saw', ctrl:'ตรวจความยาว/มุมตัด ตาม Cutting List', pic:'Supervisor + Fitter'},
  {no:'03', th:'การเตรียมประกอบท่อ', short:'Pre-fab / Fit-up', en:'Pre-fabrication (End prep, Fit-up, Tack)', wi:'WI-PIPE-03', qc:'WI-QC-PIPE-03', qr:['03-1','03-2','03-3','03-4'], cap:3, t:2.6, kind:'table', ctrl:'Fit-up inspection — ระยะ Gap / Alignment', pic:'Fitter + QC Inspector'},
  {no:'04', th:'การเชื่อม', short:'เชื่อม GTAW', en:'Welding (GTAW + purge)', wi:'WI-PIPE-04', qc:'WI-QC-PIPE-04', qr:['04-1','04-2','04-3','03-3','03-4'], cap:4, t:4.5, kind:'weld', ctrl:'VT/PT 100% ตาม WPS ที่รับรอง', pic:'Welder (WPQ) + QC Inspector'},
  {no:'05', th:'การต่อท่อแบบร่องรัด', short:'ขึ้นร่อง Groove', en:'Groove (Mechanical Grooved) Joining', wi:'WI-PIPE-05', qc:'WI-QC-PIPE-05', qr:['05-1'], cap:2, t:1.4, kind:'groove', ctrl:'ตรวจขนาดร่องตามสเปคผู้ผลิต Coupling', pic:'Operator'},
  {no:'06', th:'การตรวจสอบขนาด', short:'ตรวจสอบขนาด', en:'Dimensional Verification', wi:'WI-PIPE-06', qc:'WI-QC-PIPE-06', qr:['06-1','06-2'], cap:2, t:1.0, kind:'cmm', ctrl:'Hold Point — เทียบแบบ Isometric / GA', pic:'QC Inspector'},
  {no:'07', th:'การทดสอบแรงดัน', short:'ทดสอบแรงดัน', en:'Pressure Test (Hydro / Pneumatic)', wi:'WI-PIPE-07', qc:'WI-QC-PIPE-07', qr:['07-1'], cap:2, t:2.6, kind:'press', ctrl:'Witness Point — แจ้งลูกค้าล่วงหน้า', pic:'QC Manager'},
  {no:'08', th:'การล้างและทำความสะอาดท่อ', short:'Flushing', en:'Flushing & Cleaning', wi:'WI-PIPE-08', qc:'WI-QC-PIPE-08', qr:['08-1','08-2'], cap:2, t:1.8, kind:'flush', ctrl:'ตรวจคุณภาพน้ำ / ความสะอาดภายใน', pic:'QC Inspector'},
  {no:'09', th:'การทำ Passivation', short:'Passivation', en:'Passivation', wi:'WI-PIPE-09', qc:'WI-QC-PIPE-09', qr:['09-1','09-2','09-3'], cap:2, t:2.6, kind:'bath', ctrl:'Ferroxyl test — ไม่มี Free Iron', pic:'QC Inspector'},
  {no:'10', th:'การบรรจุหีบห่อ', short:'บรรจุหีบห่อ', en:'Packaging', wi:'WI-PIPE-10', qc:'WI-QC-PIPE-10', qr:['10-1','10-2'], cap:2, t:1.3, kind:'pack', ctrl:'Hold Point — Final inspection ก่อนส่ง', pic:'Packing Lead + QC'},
];

const JOBS = [
  {code:'PJ-2026-001', name:'Chilled Water Piping — Data Center Phase 1', client:'ABC Data Center Co., Ltd. (ตัวอย่างจาก FM-PIPE-00)', color:'#2F6FD6', pre:'CHW'},
  {code:'SPK.CS061.26', name:'COOLIT-TCL Piping Installation', client:'DAMAC BKK03-DC01', color:'#14A39A', pre:'TCS'},
];
const SIZES = ['2"','3"','4"','6"','8"'];

/* ---------- Simulation state ---------- */
const sim = { t: 0, speed: 2, running: true, spawnIn: 0, seq: 0, shipped: 0, ncr: 0, cycles: [] };
const spools = [];
const stRun = ST.map(() => ({queue: [], work: [], done: 0, util: 0}));
let rnd = mulberry(20261020);
function mulberry(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function newSpool(){
  const job = JOBS[rnd() < 0.62 ? 0 : 1];
  sim.seq++;
  const groove = rnd() < 0.3;
  const route = [0,1,2, groove ? 4 : 3, 5,6,7,8,9];
  const s = {
    id: `${job.pre}-${String(1000 + sim.seq)}`, job, groove,
    size: SIZES[Math.floor(rnd()*SIZES.length)], mat: rnd() < 0.55 ? 'SS316L' : 'SS304L',
    heat: 'H' + Math.floor(20000 + rnd()*70000), joints: 2 + Math.floor(rnd()*5),
    route, step: 0, phase: 'move', remain: 0, slot: -1, path: null, pathLen: 0, prog: 0,
    born: sim.t, log: {}, ncr: 0, shippedAt: null, mesh: null, toDock: false
  };
  spools.push(s);
  return s;
}

/* ---------- Scene layout ---------- */
const XTOP = [-16,-8,0,8,16], XBOT = [16,8,0,-8,-16];
const sideOf = i => i < 5 ? -1 : 1;          // -1 = north row, +1 = south row
const cxOf  = i => i < 5 ? XTOP[i] : XBOT[i-5];
const flowOf = i => i < 5 ? 1 : -1;          // material flows +x on north row, -x on south row
const laneZ = side => side * 1.3;
const DOCK = new THREE.Vector3(-24, 0.6, 4.2);
const RECV = new THREE.Vector3(-24, 0.6, -3.4);

function workPos(i, k){ const c = ST[i].cap; return new THREE.Vector3(cxOf(i) + (k - (c-1)/2) * 0.95, 1.02, sideOf(i)*3.5); }
function queuePos(i, q){
  const x = cxOf(i) - flowOf(i) * (2.75 + (q % 3) * 0.42);
  return new THREE.Vector3(x, 0.22 + Math.floor(q/3) * 0.4, sideOf(i)*3.5);
}
function buildPath(from, ti, toDock){
  const target = toDock ? DOCK.clone() : queuePos(ti, stRun[ti].queue.length + 1);
  const fs = from.z < 0 ? -1 : 1;
  const ts = toDock ? 1 : sideOf(ti);
  const pts = [from.clone(), new THREE.Vector3(from.x, 0.6, laneZ(fs)), new THREE.Vector3(target.x, 0.6, laneZ(fs)), new THREE.Vector3(target.x, 0.6, laneZ(ts)), target];
  let len = 0; for (let k=1;k<pts.length;k++) len += pts[k].distanceTo(pts[k-1]);
  return {pts, len};
}
function pointOnPath(path, d){
  for (let k=1;k<path.pts.length;k++){
    const seg = path.pts[k].distanceTo(path.pts[k-1]);
    if (d <= seg || k === path.pts.length-1) return path.pts[k-1].clone().lerp(path.pts[k], seg ? Math.min(1, d/seg) : 1);
    d -= seg;
  }
  return path.pts[path.pts.length-1].clone();
}

function startMove(s, fromPos, ti, toDock){
  s.phase = 'move'; s.toDock = !!toDock; s.target = ti;
  s.path = buildPath(fromPos, ti, toDock); s.prog = 0;
}

/* ---------- Sim tick (sim hours) ---------- */
const MOVE_SPEED = 14; // m per sim-hour
function tick(dt){
  sim.t += dt;
  sim.spawnIn -= dt;
  const active = spools.filter(s => !s.shippedAt).length;
  if (sim.spawnIn <= 0 && active < 46){ spawnAtReceiving(); sim.spawnIn = 1.1 + rnd()*0.7; }

  ST.forEach((st, i) => {
    const r = stRun[i];
    for (const s of [...r.work]){
      s.remain -= dt;
      if (s.remain <= 0) finishAt(i, s);
    }
    while (r.work.length < st.cap && r.queue.length){
      const s = r.queue.shift();
      const used = new Set(r.work.map(w => w.slot));
      let k = 0; while (used.has(k)) k++;
      s.slot = k; s.phase = 'work'; s.remain = st.t * (0.7 + rnd()*0.6) * (s.joints/8 + 0.5);
      s.log[i] = s.log[i] || {}; s.log[i].start = sim.t;
      r.work.push(s);
    }
    const a = 1 - Math.exp(-dt/6);
    r.util += ((r.work.length / st.cap) - r.util) * a;
  });

  for (const s of spools){
    if (s.phase !== 'move') continue;
    s.prog += MOVE_SPEED * dt;
    if (s.prog >= s.path.len){
      if (s.toDock){ s.phase = 'shipped'; s.shippedAt = sim.t; sim.shipped++; sim.cycles.push(sim.t - s.born); if (sim.cycles.length > 40) sim.cycles.shift(); }
      else { s.phase = 'queue'; s.log[s.target] = s.log[s.target] || {}; s.log[s.target].in = sim.t; stRun[s.target].queue.push(s); }
    }
  }
  // drop shipped spools after they've been visible on the truck for a while
  for (let k = spools.length-1; k >= 0; k--){
    const s = spools[k];
    if (s.shippedAt && sim.t - s.shippedAt > 30){ if (s.mesh) { scene.remove(s.mesh); } spools.splice(k,1); }
  }
}
function finishAt(i, s){
  const r = stRun[i];
  r.work.splice(r.work.indexOf(s), 1);
  r.done++;
  s.log[i].end = sim.t;
  const from = workPos(i, s.slot);
  // NCR: dimensional check or leak at pressure test sends the spool back to its joining station
  const fail = (i === 5 && rnd() < 0.04) || (i === 6 && rnd() < 0.05);
  if (fail){
    s.ncr++; sim.ncr++; s.ncrOpen = true;
    s.step = s.route.indexOf(s.groove ? 4 : 3);
    s.lastNcr = {at: ST[i].no, t: sim.t};
    startMove(s, from, s.route[s.step]);
    return;
  }
  if (i === 6) s.ncrOpen = false;
  s.step++;
  if (s.step >= s.route.length) startMove(s, from, null, true);
  else startMove(s, from, s.route[s.step]);
}
function spawnAtReceiving(){
  const s = newSpool();
  startMove(s, RECV.clone(), 0);
  return s;
}
// pre-seed so the first frame shows a working floor
function seed(){
  const plan = [[0,3],[1,2],[2,4],[3,6],[4,1],[5,2],[6,3],[7,2],[8,3],[9,2]];
  for (const [i, n] of plan){
    for (let k=0;k<n;k++){
      const s = newSpool();
      if (i === 3 && s.groove) { s.groove = false; s.route[3] = 3; }
      if (i === 4 && !s.groove) { s.groove = true; s.route[3] = 4; }
      s.step = s.route.indexOf(i);
      s.born = -(4 + s.step * 3 + rnd()*3);
      for (let p=0;p<s.step;p++) s.log[s.route[p]] = {in: s.born + p*2.5, start: s.born + p*2.5 + .4, end: s.born + p*2.5 + 2};
      s.phase = 'queue'; s.log[i] = {in: -1};
      stRun[i].queue.push(s);
    }
  }
  sim.shipped = 18; sim.ncr = 2;
  sim.cycles = [31,28,34,30,27,36,29,33];
  tick(0.0001);
  for (let k=0;k<20;k++) tick(0.15);
}

  canvas.style.cursor = 'grab';

  const r = canvas.getBoundingClientRect();
  mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(mouse, camera);

  if (hs.length){ select({spool: hs[0].object.userData.spool}); return; }

        const ri = s.route.indexOf(i);

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let last = performance.now(), uiAcc = 0, tblAcc = 0, tAnim = 0;
function frame(now){
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (sim.running){ const sdt = dt * sim.speed * 0.5; const n = Math.ceil(sdt / 0.05); for (let k=0;k<n;k++) tick(sdt/n); }
  tAnim += dt;

  for (const s of spools){
    if (!s.mesh) { s.mesh = spoolMesh(s); s.mesh.position.copy(spoolTarget(s)); }
    const tgt = spoolTarget(s);
    if (s.phase === 'move') s.mesh.position.copy(tgt);
    else s.mesh.position.lerp(tgt, 1 - Math.exp(-dt * 8));
    s.mesh.userData.ring.visible = !!s.ncrOpen;
  }
  stations.forEach((o, i) => {
    const st = stationState(i);
    if (st !== o.state){ o.state = st; o.padMat.color.setHex(STATE_COL[st]); o.edge.material.color.setHex(STATE_COL[st]); }
    o.padMat.opacity = selection.station === i ? 0.42 : 0.2;
    const busy = stRun[i].work.length > 0 && sim.running;
    const f = o.fx;
    if (f.light){ const on = busy && !reduce; f.light.intensity = on ? 1.2 + Math.random()*1.6 : 0; f.spark.visible = on && Math.random() > 0.25; }
    if (f.roll && busy && !reduce) f.roll.rotation.y += dt * 8;
    if (f.blade && busy && !reduce) f.blade.position.y = 1.0 + Math.sin(tAnim*6)*0.15;
    if (f.gantry && busy && !reduce) f.gantry.position.z = 0.2 + Math.sin(tAnim*1.4)*0.8;
    if (f.needle){ f.needle.rotation.z = busy ? -0.4 - Math.sin(tAnim*0.8)*0.6 : 0.9; }
    if (f.water && busy && !reduce) f.water.position.y = 1.6 + Math.sin(tAnim*3)*0.04;
  });
  if (flight){
    flight.k = Math.min(1, flight.k + dt * 1.4);
    const e = flight.k < .5 ? 2*flight.k*flight.k : 1 - Math.pow(-2*flight.k + 2, 2)/2;
    camera.position.lerpVectors(flight.p0, flight.p1, e); controls.target.lerpVectors(flight.t0, flight.t1, e);
    if (flight.k >= 1) flight = null;
  }
  controls.update();
  renderer.render(scene, camera);

  uiAcc += dt; tblAcc += dt;
  if (uiAcc > 0.4){
    uiAcc = 0; renderRail();
    const [d, hm] = clockTxt(sim.t); $('#clock').innerHTML = `วันที่ <b>${d}</b> · <b>${hm}</b>`;
    if (!hovering.has('#side') && !$('#side').contains(document.activeElement)) renderSide();
  }
  if (tblAcc > 1.5){ tblAcc = 0; if (!$('#p-spool').hidden && !hovering.has('#p-spool')) renderSpools(); }
  requestAnimationFrame(frame);
}

seed();
applyTheme();
resize();
renderRail(); renderSide(); renderPlan(); renderSpools(); renderDocs();
// redraw station labels once the Thai webfont is ready so canvas text uses it
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => {
  stations.forEach((o, i) => { const pos = o.label.position.clone(); scene.remove(o.label); o.label = makeLabel(ST[i].short, `${ST[i].no} · ${ST[i].wi}`); o.label.position.copy(pos); scene.add(o.label); });
});
requestAnimationFrame(frame);
})();
</script>
</body>
